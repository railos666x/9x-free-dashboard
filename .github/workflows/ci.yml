name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: System test (math engine, factors, indicators, signals)
        run: python tests/test_system.py

      - name: Strategy test (mean-reversion, risk, backtester)
        run: python tests/test_strategy.py

      # tests/test_backtest.py is excluded: it runs the v2 backtester on
      # live data in crypto_data.db, which only exists on a dev machine
      # after running `python backend/fetch_all.py`.
